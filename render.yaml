# Render blueprint for the Gandiva API (backend only). The UI lives on Vercel and proxies to this service.
# The free plan has no persistent disk, so Litestream (deploy/start.sh) copies data/gandiva.db (ledger, registry, users) to a
# bucket and restores it on every start. Without the LITESTREAM_* variables below the database is wiped on every restart or deploy.
services:
  - type: web
    name: gandiva-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeployTrigger: off # deploy by hand
    envVars:
      # Litestream replica (S3-compatible, e.g. Backblaze B2). Leave LITESTREAM_BUCKET unset to run without replication.
      - key: LITESTREAM_BUCKET
        sync: false
      - key: LITESTREAM_ENDPOINT # with https://, e.g. https://s3.us-east-005.backblazeb2.com
        sync: false
      - key: LITESTREAM_REGION # e.g. us-east-005
        sync: false
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # Public URL of THIS service, e.g. https://gandiva-api.onrender.com. Every registry listing and 402 resource URL is built from it.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BUYER_PRIVATE_KEY
        sync: false
      - key: SECRETS_KEY
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Same value as PROXY_SECRET on Vercel, so the API can trust the visitor IP the UI forwards (per-visitor rate limits).
      - key: PROXY_SECRET
        sync: false
      - key: BUYER_TOKEN
        sync: false
      - key: TRAVEL_BRIEF_KEY
        sync: false
      - key: PAYTO_SHELF_SCRAPER
        sync: false
      - key: PAYTO_CHEAP_SCRAPER
        sync: false
      - key: PAYTO_FX_RATES
        sync: false
      - key: PAYTO_HINDI_SUMMARY
        sync: false
      - key: PAYTO_CITY_INFO
        sync: false
      - key: PAYTO_SENTIMENT
        sync: false
      - key: PAYTO_JUNK_FX
        sync: false
      - key: PAYTO_MIRROR_SCRAPER
        sync: false
      - key: PAYTO_PROMO_SCRAPER
        sync: false
      - key: PAYTO_ATTACKER
        sync: false
      - key: PAYTO_TRAVEL_BRIEF
        sync: false
      # Optional: SellerStakeV2 (deploy the contract first with `npm run stake:deploy`)
      - key: STAKE_CONTRACT
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: RECEIPT_SIGNER_KEY
        sync: false
      - key: SERVER_VERIFIER_KEY
        sync: false
      - key: FACILITATOR_URL
        value: https://x402.org/facilitator
      - key: BASE_SEPOLIA_RPC
        value: https://sepolia.base.org
      - key: OLLAMA_HOST
        value: https://ollama.com
      - key: OLLAMA_MODEL
        value: gpt-oss:20b
      - key: SPEND_CAP_USDC
        value: "0.5"
      - key: SEED_ADVERSARIAL
        value: "true"

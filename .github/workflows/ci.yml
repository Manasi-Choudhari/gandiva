# Type check, tests, client build, dependency audit and a secret scan on every push and pull request.
# Spends nothing: tests mock the chain and the facilitator. Actions are pinned to commit SHAs (Dependabot bumps them).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npx vitest run

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm --prefix client ci
      - name: audit production dependencies
        run: npm --prefix client audit --omit=dev --audit-level=high
      # next build type-checks too and generates the route types the plain tsc run needs.
      - run: npm --prefix client run build
      - run: npm --prefix client run typecheck

  # SellerStakeV2: Foundry tests, a local copy of Base Sepolia, the committed build and the static analysers.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read only, and only to copy the chain: all changes stay in the runner.
      FORK_RPC: https://sepolia.base.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
      - run: npm ci
      - name: unit, fuzz, invariant and fork tests
        run: forge test
      - name: contracts/SellerStakeV2.json matches the source
        run: |
          npm run stake:compile
          git diff --exit-code contracts/SellerStakeV2.json
      - name: full rehearsal on a local chain
        run: npm run stake:dry-run
      - name: slither
        run: |
          pipx install slither-analyzer==0.11.6
          slither .
      # Report only: it is on the run's summary page and does not fail the build.
      - name: aderyn
        continue-on-error: true
        run: |
          npx --yes @cyfrin/aderyn@0.6.8 --output "$RUNNER_TEMP/aderyn.md"
          cat "$RUNNER_TEMP/aderyn.md" >> "$GITHUB_STEP_SUMMARY"

  # The official release binary, checked against its sha256 (avoids the gitleaks-action licence key).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks
        run: |
          f=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: scan the full history
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact=100 --verbose'

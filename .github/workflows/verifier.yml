# One of the three SellerStakeV2 verifiers (the others: the API on Render, and a sealed backup key for emergencies).
# Every 5 minutes it re-checks the open stake claims on its own and signs the ones the evidence supports.
# Settings -> Secrets and variables -> Actions: secret VERIFIER_KEY; variables GANDIVA_URL and STAKE_CONTRACT.
# The job is skipped while STAKE_CONTRACT is empty.
name: stake verifier

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: verifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: vars.STAKE_CONTRACT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      # No install scripts: this job holds a key, and it needs none of the packages that compile on install.
      - run: npm ci --ignore-scripts
      - run: npm run verifier -- --once
        env:
          VERIFIER_KEY: ${{ secrets.VERIFIER_KEY }}
          GANDIVA_URL: ${{ vars.GANDIVA_URL }}
          STAKE_CONTRACT: ${{ vars.STAKE_CONTRACT }}
